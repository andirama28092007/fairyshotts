<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #a162e8; /* Matching the theme color */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            font-family: Arial, sans-serif;
        }
        .placeholder {
            text-align: center;
            color: white;
        }
        .circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6bcb 0%, #a162e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .initials {
            font-size: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="circle">
            <div class="initials">AT</div>
        </div>
        <h2>Andi Tenri Uly<br>Ganiyyu Wulandari</h2>
        <p>Owner of Fairyshotts</p>
    </div>
</body>
</html>
